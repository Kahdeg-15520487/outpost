<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `interactive-widget=resizes-content`: the layout viewport shrinks when an on-screen keyboard
         opens, so the composer stays above it instead of behind it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/svg+xml" href="/outpost.svg" />
    <meta name="description" content="Outpost: a self-hosted workspace for AI agents, modules and missions." />
    <title>Outpost</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
