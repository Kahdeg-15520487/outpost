<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #13151c; color: #ecebe6; font: 15px/1.4 ui-sans-serif, system-ui, sans-serif; }
  .game { width: min(420px, 92vw); text-align: center; }
  .seats { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-bottom: 20px; }
  .seat { padding: 12px; border-radius: 14px; background: #1d2029; border: 2px solid transparent; transition: border-color .2s; }
  .seat.turn { border-color: currentColor; }
  .seat.x { color: #ff8a5c; } .seat.o { color: #6cc4ff; }
  .seat .mark { font-size: 28px; font-weight: 800; }
  .seat .who { color: #ecebe6; font-size: 13px; min-height: 18px; }
  .seat button { margin-top: 6px; font: inherit; font-size: 12px; border: 0; border-radius: 8px; padding: 4px 10px; cursor: pointer; background: currentColor; }
  .seat button span { color: #13151c; font-weight: 700; }
  .vs { color: #6d7180; font-size: 13px; }
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; aspect-ratio: 1; position: relative; }
  .cell { border: 0; border-radius: 16px; background: #1d2029; font: 800 clamp(40px, 13vw, 84px)/1 ui-sans-serif, system-ui; cursor: pointer; transition: background .15s, transform .1s; }
  .cell:hover:not(:disabled) { background: #262a35; }
  .cell:active:not(:disabled) { transform: scale(.97); }
  .cell.X { color: #ff8a5c; } .cell.O { color: #6cc4ff; }
  .cell.win { background: #2c3140; animation: pulse 1s ease-in-out infinite alternate; }
  .cell.pop { animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  @keyframes pulse { to { background: #383e50; } }
  .status { margin: 18px 0 8px; font-size: 18px; font-weight: 600; min-height: 26px; }
  .score { color: #8b8f9c; font-size: 13px; }
  .again { margin-top: 12px; font: inherit; border: 0; border-radius: 10px; padding: 9px 18px; background: #ecebe6; color: #13151c; font-weight: 700; cursor: pointer; }
  .err { color: #ff6b6b; font-size: 13px; min-height: 18px; margin-top: 6px; }
</style>
</head>
<body>
<div class="game">
  <div class="seats">
    <div class="seat x" id="seatX"><div class="mark">X</div><div class="who"></div></div>
    <div class="vs">vs</div>
    <div class="seat o" id="seatO"><div class="mark">O</div><div class="who"></div></div>
  </div>
  <div class="board" id="board"></div>
  <div class="status" id="status"></div>
  <div class="score" id="score"></div>
  <button class="again" id="again" hidden>Play again</button>
  <div class="err" id="err"></div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  let s = null, prev = [];
  const fail = (e) => { $("err").textContent = e.message; setTimeout(() => ($("err").textContent = ""), 3000); };
  const set = (p) => p.then((n) => { s = n; render(); }).catch(fail);
  const cells = [...Array(9)].map((_, i) => { const b = document.createElement("button"); b.className = "cell"; b.onclick = () => set(gadget.api.move(i)); $("board").append(b); return b; });

  function seat(side) {
    const el = $("seat" + side), p = s.players[side], mine = p && p.id === gadget.user.id;
    el.classList.toggle("turn", !s.winner && s.turn === side);
    el.querySelector(".who").textContent = p ? p.name + (mine ? " (you)" : "") : "open seat";
    el.querySelector("button")?.remove();
    if (!p && gadget.user.role !== "viewer") {
      const b = document.createElement("button"); b.innerHTML = "<span>Sit here</span>"; b.onclick = () => set(gadget.api.join(side)); el.append(b);
    }
  }
  function render() {
    seat("X"); seat("O");
    const myTurn = s.players[s.turn] && s.players[s.turn].id === gadget.user.id;
    s.board.forEach((v, i) => {
      const c = cells[i];
      c.textContent = v || ""; c.className = "cell" + (v ? " " + v : "") + (s.line && s.line.includes(i) ? " win" : "") + (v && !prev[i] ? " pop" : "");
      c.disabled = !!v || !!s.winner || !myTurn;
    });
    prev = [...s.board];
    const name = (k) => (s.players[k] ? s.players[k].name : k);
    $("status").textContent = s.winner === "draw" ? "It's a draw." : s.winner ? `${name(s.winner)} wins!` : !s.players.X || !s.players.O ? "Waiting for players — sit down, or ask the agent to join." : myTurn ? "Your move." : `${name(s.turn)} is thinking…`;
    $("score").textContent = `X ${s.score.X} · O ${s.score.O} · draws ${s.score.draw}`;
    $("again").hidden = !s.winner;
  }
  $("again").onclick = () => set(gadget.api.reset());
  gadget.on("state", (n) => { s = n; render(); });
  gadget.api.state().then((n) => { s = n; render(); });
</script>
</body>
</html>
